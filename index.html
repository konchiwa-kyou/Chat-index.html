<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2人専用チャット（通知進化版）</title>
    <style>
        :root { --bg-color: #f0f2f5; --chat-bg: #ffffff; --my-msg: #0084ff; --other-msg: #e4e6eb; }
        body { font-family: sans-serif; background: var(--bg-color); margin: 0; padding: 0; }
        .chat-container { width: 100%; max-width: 600px; background: var(--chat-bg); margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 70%; padding: 10px 14px; border-radius: 18px; font-size: 15px; word-break: break-all; }
        .message.me { background: var(--my-msg); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.other { background: var(--other-msg); color: black; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; background: #fff; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 16px; }
        button { background: var(--my-msg); color: white; border: none; padding: 0 20px; border-radius: 20px; margin-left: 10px; cursor: pointer; font-size: 16px; }
        .setup { padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        #token-status { font-size: 12px; color: green; margin-top: 10px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div id="setup-screen" class="setup">
        <h3>名前を入力して開始</h3>
        <input type="text" id="username" placeholder="例: タロウ、ハナコ">
        <button onclick="startChat()">チャット開始</button>
        <div id="token-status"></div>
    </div>

    <div id="chat-screen" class="messages hidden"></div>
    <div id="input-screen" class="input-area hidden">
        <input type="text" id="msg-input" placeholder="メッセージを入力..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">送信</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, setDoc, getDocs } from "https://gstatic.com";
  import { getMessaging, getToken } from "https://gstatic.com";

  const firebaseConfig = {
    apiKey: "AIzaSyAIxoojCu0bUXoW8e6-rjR0UvTNjdRmM3I",
    authDomain: "my-chatkdn.firebaseapp.com",
    projectId: "my-chatkdn",
    storageBucket: "my-chatkdn.firebasestorage.app",
    messagingSenderId: "407770418634",
    appId: "1:407770418634:web:faf7202d5f02677bc5d333",
    measurementId: "G-HGK3904C3G"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const messaging = getMessaging(app);

  let myName = "";

  async function setupNotification() {
    try {
      const registration = await navigator.serviceWorker.register('firebase-messaging-sw.js');
      
      const currentToken = await getToken(messaging, {
        vapidKey: 'B0vJDUuBoPRlLSkfqvPqE0k15rx9GxHjL-6DTbk9Nwx5TwjDZFtnqOtMh542z672JvdEHaBuThj_0mF6IwRzs8',
        serviceWorkerRegistration: registration
      });

      if (currentToken) {
        await setDoc(doc(db, "tokens", myName), { token: currentToken });
        document.getElementById("token-status").innerText = "🔔 通知の準備が完了しました";
      }
    } catch (err) {
      console.error('通知設定エラー:', err);
      document.getElementById("token-status").innerText = "⚠️ 通知設定に失敗しました";
    }
  }

  window.startChat = async function() {
    const nameInput = document.getElementById("username").value.trim();
    if (!nameInput) return alert("名前を入力してください");
    myName = nameInput;

    document.getElementById("token-status").innerText = "通知を設定中...";
    await setupNotification();

    document.getElementById("setup-screen").classList.add("hidden");
    document.getElementById("chat-screen").classList.remove("hidden");
    document.getElementById("input-screen").classList.remove("hidden");

    listenMessages();
  };

  function listenMessages() {
    const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
    onSnapshot(q, (snapshot) => {
      const chatScreen = document.getElementById("chat-screen");
      chatScreen.innerHTML = "";
      snapshot.forEach((doc) => {
        const data = doc.data();
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("message", data.sender === myName ? "me" : "other");
        msgDiv.innerText = data.text;
        chatScreen.appendChild(msgDiv);
      });
      chatScreen.scrollTop = chatScreen.scrollHeight;
    });
  }

  window.sendMessage = async function() {
    const input = document.getElementById("msg-input");
    const text = input.value.trim();
    if (!text) return;

    input.value = "";

    await addDoc(collection(db, "messages"), {
      sender: myName,
      text: text,
      timestamp: new Date()
    });

    const tokenDocs = await getDocs(collection(db, "tokens"));
    tokenDocs.forEach(async (docSnap) => {
      if (docSnap.id !== myName) {
        await addDoc(collection(db, "notifications"), {
          targetUid: docSnap.id,
          senderName: myName,
          text: text,
          timestamp: new Date()
        });
      }
    });
  };

  window.handleKey = function(e) { if (e.key === "Enter") sendMessage(); };
</script>
</body>
</html>
